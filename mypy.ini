[mypy]
python_version = 3.14
warn_unused_ignores = True
mypy_path = .
namespace_packages = True
explicit_package_bases = True

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-simplejpeg.*]
ignore_missing_imports = True

[mypy-mcap.writer]
follow_imports = skip

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-av.*]
ignore_missing_imports = True
