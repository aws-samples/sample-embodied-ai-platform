version: 0.2

phases:
  pre_build:
    commands:
      - echo "Build started on $(date)"
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - "export AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - "export IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:${IMAGE_TAG:-latest}"
      - 'echo "Image URI: $IMAGE_URI"'
      - 'echo "Dockerfile: $DOCKERFILE"'
      # Login to NVIDIA NGC registry for Isaac Sim base image (rollout only)
      - docker login nvcr.io --username '$oauthtoken' --password "${NGC_API_KEY:-none}" || true

  build:
    commands:
      - echo "Building $ECR_REPOSITORY_NAME..."
      - docker build -f $CODEBUILD_SRC_DIR/$DOCKERFILE -t $IMAGE_URI $CODEBUILD_SRC_DIR
      - docker tag $IMAGE_URI $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:$CODEBUILD_BUILD_NUMBER

  post_build:
    commands:
      - docker push $IMAGE_URI
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:$CODEBUILD_BUILD_NUMBER
      - echo $IMAGE_URI > image_uri.txt
      - echo "Build completed on $(date)"

artifacts:
  files:
    - image_uri.txt
