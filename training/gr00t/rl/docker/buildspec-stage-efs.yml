version: 0.2

phases:
  install:
    commands:
      - pip install huggingface-hub

  pre_build:
    commands:
      - echo "EFS staging started on $(date)"
      - export MODEL_REPO="nvidia/GR00T-N1.5-RL-Rheo-AssembleTrocar"
      - export MODEL_DIR="/mnt/efs/models/GR00T-N1.5-RL-Rheo-AssembleTrocar"
      - df -h /mnt/efs

  build:
    commands:
      # Stage the COMPLETE i4h-workflows rheo/scripts tree from a PINNED commit
      # (v0.5.0 = fb7727e), then overlay ONLY our custom RL config — same strategy as
      # the EKS path's infra/stage-s3-eks.sh. A hand-picked subset drops interdependent
      # sibling packages (teleop_devices, simulation.assets) and breaks env creation.
      # The CodeBuild source is the rl/ root, so the overlay is at $CODEBUILD_SRC_DIR/workflows/.
      - echo "Staging workflows (pinned i4h-workflows clone + custom RL config overlay)..."
      - mkdir -p /mnt/efs/workflows/rheo/scripts
      - rm -rf /tmp/i4h-workflows
      - git clone --filter=blob:none https://github.com/isaac-for-healthcare/i4h-workflows.git /tmp/i4h-workflows
      - git -C /tmp/i4h-workflows checkout fb7727ef12e980022997fccb6cbca5621e4616e4
      - cp -r /tmp/i4h-workflows/workflows/rheo/scripts/. /mnt/efs/workflows/rheo/scripts/
      - cp -r "$CODEBUILD_SRC_DIR/workflows/simulation/rl/rlinf_ext/config/." /mnt/efs/workflows/rheo/scripts/simulation/rl/rlinf_ext/config/
      - echo "Staging RLinf..."
      - mkdir -p /mnt/efs/third_party
      - rm -rf /mnt/efs/third_party/RLinf
      - git clone https://github.com/RLinf/RLinf.git /mnt/efs/third_party/RLinf && cd /mnt/efs/third_party/RLinf && git checkout 649e7579775997ade74efff33a7c23e90c61e60a || true
      # NOTE: the RLinf _broadcast patch is applied on the EKS path by
      # infra/stage-s3-eks.sh (run via the GR00T-RL-Pipeline CodeBuild project,
      # stage-data mode). The Batch/EFS path here is legacy and relies on the
      # auto-recover harness.
      - echo "Staging Isaac-GR00T..."
      - rm -rf /mnt/efs/third_party/Isaac-GR00T
      - git clone https://github.com/NVIDIA/Isaac-GR00T.git /mnt/efs/third_party/Isaac-GR00T && cd /mnt/efs/third_party/Isaac-GR00T && git checkout 4af2b622892f7dcb5aae5a3fb70bcb02dc217b96 || true
      - echo "Staging IsaacLab..."
      - rm -rf /mnt/efs/third_party/IsaacLab
      - git clone https://github.com/isaac-sim/IsaacLab.git /mnt/efs/third_party/IsaacLab && cd /mnt/efs/third_party/IsaacLab && git checkout 941ebdf4a || true
      - echo "Staging IsaacLab-Arena..."
      - rm -rf /mnt/efs/third_party/IsaacLab-Arena
      - git clone https://github.com/isaac-sim/IsaacLab-Arena.git /mnt/efs/third_party/IsaacLab-Arena && cd /mnt/efs/third_party/IsaacLab-Arena && git checkout dba099565 || true
      - echo "Staging model checkpoint..."
      - if [ -f "$MODEL_DIR/config.json" ]; then echo "Model already staged"; else mkdir -p "$MODEL_DIR" && hf download "$MODEL_REPO" --local-dir "$MODEL_DIR"; fi

  post_build:
    commands:
      - echo "EFS staging complete on $(date)"
      - ls -la "$MODEL_DIR"
      - du -sh /mnt/efs/models/ /mnt/efs/third_party/ 2>/dev/null || true
