version: 0.2

phases:
  install:
    commands:
      - pip install huggingface-hub

  pre_build:
    commands:
      - echo "EFS staging started on $(date)"
      - export MODEL_REPO="nvidia/GR00T-N1.5-RL-Rheo-AssembleTrocar"
      - export MODEL_DIR="/mnt/efs/models/GR00T-N1.5-RL-Rheo-AssembleTrocar"
      - export I4H_REPO="https://github.com/isaac-for-healthcare/i4h-workflows.git"
      - export I4H_VERSION="v0.5.0"
      - export I4H_DIR="/mnt/efs/i4h-workflows"
      - df -h /mnt/efs

  build:
    commands:
      - echo "Staging i4h-workflows..."
      - if [ -d "$I4H_DIR/.git" ]; then cd "$I4H_DIR" && git fetch --tags && git checkout "$I4H_VERSION"; else git clone --branch "$I4H_VERSION" --depth 1 "$I4H_REPO" "$I4H_DIR"; fi
      - cd "$I4H_DIR" && git submodule update --init --recursive --depth 1 || true
      - echo "Staging RLinf..."
      - mkdir -p /mnt/efs/third_party
      - rm -rf /mnt/efs/third_party/RLinf
      - git clone https://github.com/RLinf/RLinf.git /mnt/efs/third_party/RLinf && cd /mnt/efs/third_party/RLinf && git checkout 649e7579775997ade74efff33a7c23e90c61e60a || true
      - echo "Staging Isaac-GR00T..."
      - rm -rf /mnt/efs/third_party/Isaac-GR00T
      - git clone https://github.com/NVIDIA/Isaac-GR00T.git /mnt/efs/third_party/Isaac-GR00T && cd /mnt/efs/third_party/Isaac-GR00T && git checkout 4af2b622892f7dcb5aae5a3fb70bcb02dc217b96 || true
      - echo "Staging model checkpoint..."
      - if [ -f "$MODEL_DIR/config.json" ]; then echo "Model already staged"; else mkdir -p "$MODEL_DIR" && hf download "$MODEL_REPO" --local-dir "$MODEL_DIR"; fi
      - ln -sfn "$I4H_DIR/workflows" /mnt/efs/workflows || true

  post_build:
    commands:
      - echo "EFS staging complete on $(date)"
      - ls -la "$MODEL_DIR"
      - du -sh /mnt/efs/models/ /mnt/efs/third_party/ 2>/dev/null || true
