version: 0.2

# CodeBuild buildspec for the GR00T-RL-Stage-S3 project (defined in
# infra/eks_kuberay_stack.py). It runs the SAME fail-closed engine a local
# operator would (infra/stage-s3-eks.sh), non-interactively, to populate the EKS
# data bucket that the FSx-Lustre DRA imports from: clone the pinned third-party
# repos, APPLY the RLinf _broadcast patch, download the RL model, stage the
# bundled workflows, and upload everything to s3://$S3_DATA_BUCKET/.
#
# S3_DATA_BUCKET + AWS_REGION are injected as environment variables by the CDK
# project. The source asset is the whole rl/ dir, so $CODEBUILD_SRC_DIR contains
# infra/, patches/, and workflows/.

phases:
  install:
    commands:
      - echo "S3 staging started on $(date)"
      # Lower-bound pin: the `hf` CLI (used by stage-s3-eks.sh) needs huggingface-hub >= 0.34.
      - pip install --quiet "huggingface-hub>=0.34,<1.0"
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - test -n "$S3_DATA_BUCKET" || { echo "S3_DATA_BUCKET not set by the CodeBuild project"; exit 1; }
      - test -n "${AWS_REGION:-}" || export AWS_REGION="$AWS_DEFAULT_REGION"
      # Stage under CODEBUILD_SRC_DIR (the path AWS documents the ~128 GB disk for),
      # NOT the script's default /tmp mktemp. df -h so a disk-pressure failure is legible.
      - mkdir -p "$CODEBUILD_SRC_DIR/.stage" && df -h "$CODEBUILD_SRC_DIR"
      # --yes = non-interactive confirm (this is CI); the script still fails
      # closed on any clone/checkout/patch/verify failure.
      - bash infra/stage-s3-eks.sh --execute --yes --workdir "$CODEBUILD_SRC_DIR/.stage"
  post_build:
    commands:
      - echo "S3 staging complete on $(date)"
