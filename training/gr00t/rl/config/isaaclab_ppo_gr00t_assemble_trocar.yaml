# Hydra config for GR00T RL post-training on the Assemble Trocar task.
# Adapted from i4h-workflows/workflows/rheo/scripts/simulation/rl/rlinf_ext/config/
#
# This config is designed for AWS Batch MNP deployment:
#   - Main node (learner): FSDP across 8 GPUs on g7e.48xlarge
#   - Child nodes (rollouts): Isaac Sim environments on g6e.4xlarge
#
# Override at submit time via Hydra CLI:
#   env.train.total_num_envs=128 actor.micro_batch_size=4

defaults:
  - /env@env.train: assemble_trocar
  - /env@env.eval: assemble_trocar
  - /model@actor.model: gr00t_dex3
  - /model@rollout.model: gr00t_dex3
  - _self_

runner:
  max_epochs: 1000
  save_interval: 50
  eval_interval: 50
  log_interval: 10
  resume_dir: null
  logger:
    log_path: null  # Set by entrypoint at runtime

env:
  group_name: "EnvGroup"
  channel:
    name: "env_buffer_list"
    queue_name: "obs_buffer"
    queue_size: 0
  enable_offload: False

  train:
    total_num_envs: 512
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: False
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/train

  eval:
    total_num_envs: 128
    max_episode_steps: 256
    max_steps_per_rollout_epoch: 256
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: True
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      id: "Isaac-Assemble-Trocar-G129-Dex3-Joint-Eval"

rollout:
  group_name: "RolloutGroup"
  channel:
    name: ${env.channel.name}
    queue_name: "action_buffer"
    queue_size: 0
  mode: "colocate"
  backend: "huggingface"
  enable_offload: True
  model:
    model_path: "/mnt/efs/models/GR00T-N1.5-RL-Rheo-AssembleTrocar"

actor:
  group_name: "ActorGroup"
  micro_batch_size: 8
  backend: "fsdp"
  model:
    model_path: "/mnt/efs/models/GR00T-N1.5-RL-Rheo-AssembleTrocar"
  optimizer:
    lr: 5e-6
    weight_decay: 0.01
  value_optimizer:
    lr: 1e-4
    weight_decay: 0.01

ppo:
  clip_range: 0.2
  value_clip_range: 0.2
  entropy_coef: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  num_mini_batches: 4
  ppo_epochs: 4
  normalize_advantage: True
  global_batch_size: 1024

cluster:
  num_nodes: null  # Auto-detected from Ray cluster size
  resources_per_node:
    learner:
      num_cpus: 16
      num_gpus: 8
    rollout:
      num_cpus: 14
      num_gpus: 1
